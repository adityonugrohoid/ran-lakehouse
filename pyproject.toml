[project]
name = "ran-lakehouse"
version = "0.1.0"
description = "Mini telecom lakehouse and data generator for a synthetic LTE and GSM multi-vendor operator."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Adityo Nugroho" }]
requires-python = ">=3.12"
dependencies = [
    "dbt-core==1.12.5",
    "dbt-duckdb==1.11.0",
    "duckdb==1.5.6",
    "jsonschema==4.26.0",
    "lxml==6.1.3",
    "matplotlib==3.11.2",
    "numpy==2.5.3",
    "ortools==9.15.6755",
    "pyiceberg[pyarrow]==0.12.0",
    "pytz==2026.4",
]

[project.scripts]
ranlake = "ran_lakehouse.cli:main"

[dependency-groups]
dev = [
    "mypy==2.3.1",
    "pytest==9.1.1",
    "ruff==0.16.9",
    "types-jsonschema==4.26.0.20260518",
]
stackcheck = [
    "sqlmesh==0.236.2",
]

[build-system]
requires = ["uv_build>=0.12.20,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "-m", "not network and not lake"]
markers = [
    "network: fetches from the internet (run with `pytest -m network`)",
    "lake: needs the local compose stack (run with `pytest -m lake`)",
]

[[tool.mypy.overrides]]
# pyarrow, lxml and OR-Tools ship no type information.
module = ["pyarrow", "pyarrow.*", "lxml", "lxml.*", "ortools", "ortools.*"]
ignore_missing_imports = true
